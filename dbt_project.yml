name: 'booknest'
version: '1.0.0'
config-version: 2

profile: 'booknest'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  booknest:
    bronze:
      +materialized: view
      +schema: bronze
    silver:
      +materialized: view
      +schema: silver
    gold:
      +schema: gold
      dim:
        +materialized: table
      fct:
        +materialized: table
      marts:
        +materialized: table

seeds:
  booknest:
    +schema: raw
